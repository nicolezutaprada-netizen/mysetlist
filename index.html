<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-setlist</title>
</head>

<body>
 <h1>🎵 Mi Setlist </h1>
<section>
    <input type="text" id="inputbusqueda" placeholder="Buscar por artista o título">
    <button id="btnbuscar"> Buscar</button>
    <p id="mensajebusqueda">  </p>     <!-- Aquí se mostrará el estado: cargando, error, sin resultados -->
    <ul id="listaresultados"> </ul>          <!-- Aquí se mostrarán los resultados de la búsqueda -->
</section>

<!-- Gestión de playlists (HU-02) -->
<section>
    <h2>Mis Playlists</h2>
    <input type="text" id="nombreplaylist" placeholder="Nombre de la playlist">
    <button id="btncrearplaylist">Crear playlist</button>

    <p id="mensajeplaylist"></p> <!-- para el mensaje de validación (nombre vacío) -->

    

    <ul id="listaplaylists">  <!-- aquí se mostrarán las playlists creadas -->
   
    <div id="detalle-playlist"></div>   <!-- Detalle de la playlist seleccionada (HU-04) -->

    </ul> 
</section>










<script type="module" src="js/app.js"></script> 
</body>
</html>
